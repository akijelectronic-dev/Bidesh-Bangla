<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06120d">
<title>Bidesh Bangla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06120d; --green:#00a86b; --green-d:#006a4e; --red:#f42a41; --red-d:#c4162b;
  --text:#eef5f1; --muted:#8fa89b; --glass:rgba(255,255,255,.06); --glass-b:rgba(255,255,255,.14);
  --mine:rgba(0,168,107,.28); --theirs:rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Hind Siliguri',system-ui,sans-serif;color:var(--text);background:var(--bg);
  overflow:hidden;
  background-image:
    radial-gradient(circle at 15% 10%,rgba(0,106,78,.55),transparent 45%),
    radial-gradient(circle at 90% 90%,rgba(244,42,65,.35),transparent 40%);
}
.orb{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none}
.orb.g{width:240px;height:240px;background:var(--green);opacity:.25;top:-60px;right:-60px}
.orb.r{width:200px;height:200px;background:var(--red);opacity:.22;bottom:-50px;left:-50px}
.hidden{display:none!important}
.app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

/* Brand */
.brand{font-family:'Fraunces',serif;font-weight:800;letter-spacing:.01em}
.flag{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--green-d);position:relative;vertical-align:middle;margin-right:8px}
.flag::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--red);top:6px;left:6px}

/* Auth */
#authView{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.card{width:100%;border-radius:28px;padding:30px 24px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.card h1{font-size:30px;line-height:1.1;margin-bottom:6px}
.card .sub{color:var(--muted);font-size:15px;margin-bottom:22px}
.tabs{display:flex;gap:6px;padding:5px;border-radius:16px;margin-bottom:20px;background:rgba(0,0,0,.25)}
.tabs button{flex:1;padding:10px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:600 15px 'Hind Siliguri',sans-serif;cursor:pointer;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
input{width:100%;padding:14px 16px;margin-bottom:14px;border-radius:14px;border:1px solid var(--glass-b);
  background:rgba(0,0,0,.28);color:var(--text);font:16px 'Hind Siliguri',sans-serif;outline:none;transition:.2s}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,168,107,.25)}
.btn{width:100%;padding:15px;border:0;border-radius:14px;font:700 16px 'Hind Siliguri',sans-serif;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 8px 24px rgba(0,168,107,.35);transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.err{color:#ff8a98;font-size:14px;min-height:20px;margin-top:12px;text-align:center}
.cfgwarn{background:rgba(244,42,65,.15);border:1px solid rgba(244,42,65,.5);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:16px}

.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0 14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--glass-b)}
.social{display:flex;gap:10px}
.soc{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;border:1px solid var(--glass-b);background:rgba(255,255,255,.08);color:var(--text);font:600 15px 'Hind Siliguri',sans-serif;cursor:pointer;transition:.15s}
.soc:active{transform:scale(.98)}
.soc svg{width:20px;height:20px}

/* Chat */
#chatView{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin:10px 12px 0;border-radius:20px}
.top .who{font-size:12px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{border:1px solid rgba(244,42,65,.6);background:rgba(244,42,65,.15);color:#ff9aa6;padding:8px 14px;border-radius:12px;font:600 14px 'Hind Siliguri',sans-serif;cursor:pointer}
.logout:active{background:var(--red-d);color:#fff}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:15px;padding:20px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere;border:1px solid var(--glass-b)}
.msg .n{font-size:12px;font-weight:600;color:#6fe3b3;margin-bottom:2px}
.msg .t{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}
.msg.theirs{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:6px}
.msg.mine{align-self:flex-end;background:var(--mine);border-color:rgba(0,168,107,.5);border-bottom-right-radius:6px}
.msg.mine .n{display:none}
.composer{display:flex;gap:10px;padding:10px 12px 12px;align-items:center}
.composer input{margin:0;border-radius:24px;flex:1}
.send{width:48px;height:48px;border-radius:50%;border:0;flex:none;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--red),var(--red-d));box-shadow:0 6px 18px rgba(244,42,65,.4);display:grid;place-items:center}
.send:active{transform:scale(.93)}
.send svg{width:22px;height:22px}
@media(min-width:481px){.app{margin-top:2vh;height:96%;border-radius:32px;border:1px solid var(--glass-b);background:rgba(0,0,0,.2);overflow:hidden}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="orb g"></div><div class="orb r"></div>

<div class="app">

  <!-- AUTH -->
  <section id="authView">
    <div class="card glass">
      <h1 class="brand"><span class="flag"></span>Bidesh Bangla</h1>
      <p class="sub">প্রবাসী বাংলাদেশিদের নিজের ঠিকানা। Connect with Bangladeshis abroad.</p>
      <div id="cfgWarn" class="cfgwarn hidden">Firebase config missing. Paste your keys into <b>firebaseConfig</b> in this file.</div>
      <div class="tabs">
        <button id="tabLogin" class="on" type="button">Log in</button>
        <button id="tabSignup" type="button">Sign up</button>
      </div>
      <div id="authForm">
        <div id="nameWrap" class="hidden">
          <label for="name">Full name</label>
          <input id="name" type="text" autocomplete="name" placeholder="Rahim Uddin">
          <label for="country">Country you live in</label>
          <input id="country" type="text" placeholder="e.g. Malaysia, UAE, UK">
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
        <button id="authBtn" class="btn" type="button">Log in</button>
        <div class="divider">or continue with</div>
        <div class="social">
          <button id="googleBtn" class="soc" type="button">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.57-5.17 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.29A7.2 7.2 0 0 1 4.9 12c0-.8.14-1.57.37-2.29v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.61l4 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
            Google
          </button>
          <button id="facebookBtn" class="soc" type="button">
            <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.88 11.85v-8.38H7.08V12h3.04V9.36c0-3 1.8-4.67 4.53-4.67 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.87V12h3.32l-.53 3.47h-2.79v8.38A12 12 0 0 0 24 12z"/></svg>
            Facebook
          </button>
        </div>
        <div id="authErr" class="err" role="alert"></div>
      </div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="chatView" class="hidden">
    <header class="top glass">
      <div>
        <div class="brand" style="font-size:19px"><span class="flag"></span>Bidesh Bangla</div>
        <div class="who" id="who"></div>
      </div>
      <button id="logoutBtn" class="logout" type="button">Logout</button>
    </header>
    <div id="msgs" aria-live="polite"></div>
    <div class="composer">
      <input id="msgInput" type="text" maxlength="1000" placeholder="Write a message…" autocomplete="off">
      <button id="sendBtn" class="send" type="button" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile,
  GoogleAuthProvider, FacebookAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== PASTE YOUR FIREBASE CONFIG HERE (Firebase Console → Project settings → Your apps → Web) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAomgSQ-KVdKWIL-og7DPjHBOTZL2h-zW8",
  authDomain: "bidesh-bangla.firebaseapp.com",
  projectId: "bidesh-bangla",
  storageBucket: "bidesh-bangla.firebasestorage.app",
  messagingSenderId: "1050326218542",
  appId: "1:1050326218542:web:272d861b2042a364d62cbf",
  measurementId: "G-6CP5W9CKTE"
};
/* ================================================================================================== */

const $ = id => document.getElementById(id);
const configured = !firebaseConfig.apiKey.startsWith("YOUR_");
if (!configured) $("cfgWarn").classList.remove("hidden");

let app, auth, db, unsub = null, mode = "login";
if (configured) { app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); }

/* ---- Auth UI ---- */
function setMode(m){
  mode = m;
  $("tabLogin").classList.toggle("on", m === "login");
  $("tabSignup").classList.toggle("on", m === "signup");
  $("nameWrap").classList.toggle("hidden", m === "login");
  $("authBtn").textContent = m === "login" ? "Log in" : "Create account";
  $("password").autocomplete = m === "login" ? "current-password" : "new-password";
  $("authErr").textContent = "";
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");

const friendly = code => ({
  "auth/invalid-email":"Enter a valid email address.",
  "auth/missing-password":"Enter your password.",
  "auth/weak-password":"Password must be at least 6 characters.",
  "auth/email-already-in-use":"This email already has an account. Log in instead.",
  "auth/invalid-credential":"Wrong email or password.",
  "auth/user-not-found":"No account found for this email.",
  "auth/wrong-password":"Wrong email or password.",
  "auth/too-many-requests":"Too many attempts. Try again in a few minutes.",
  "auth/network-request-failed":"Network error. Check your connection.",
  "auth/operation-not-allowed":"This login method is not enabled in Firebase Console → Authentication → Sign-in method.",
  "auth/account-exists-with-different-credential":"This email is already registered with a different login method.",
  "auth/unauthorized-domain":"This domain is not authorised. Add it in Firebase Console → Authentication → Settings → Authorized domains.",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"Invalid Firebase API key. Check firebaseConfig.",
  "auth/invalid-api-key":"Invalid Firebase API key. Check firebaseConfig.",
  "auth/configuration-not-found":"Authentication is not set up. Click Get started in Firebase Console → Authentication.",
  "auth/popup-blocked":"Popup was blocked. Allow popups and try again.",
  "permission-denied":"Firestore rules blocked this. Check your security rules."
}[code] || ("Something went wrong (" + code + ")."));

async function submitAuth(){
  if (!configured) { $("authErr").textContent = "Add your Firebase config first."; return; }
  const email = $("email").value.trim(), pass = $("password").value;
  const btn = $("authBtn"); $("authErr").textContent = ""; btn.disabled = true;
  try {
    if (mode === "signup") {
      const name = $("name").value.trim(), country = $("country").value.trim();
      if (!name) throw { code: "x", message: "Enter your full name." };
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      try {
        await updateProfile(cred.user, { displayName: name });
        $("who").textContent = name;
        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid, name, email, country, createdAt: serverTimestamp()
        }, { merge: true });
      } catch (e2) { console.error("Profile save failed:", e2); }
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    console.error(e);
    $("authErr").textContent = e.code === "x" ? e.message : friendly(e.code);
  } finally { btn.disabled = false; }
}

async function socialLogin(provider){
  if (!configured) { $("authErr").textContent = "Add your Firebase config first."; return; }
  $("authErr").textContent = "";
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    if (e.code === "auth/popup-blocked") { await signInWithRedirect(auth, provider); return; }
    console.error(e); $("authErr").textContent = friendly(e.code);
  }
}
$("googleBtn").onclick = () => socialLogin(new GoogleAuthProvider());
$("facebookBtn").onclick = () => socialLogin(new FacebookAuthProvider());
if (configured) getRedirectResult(auth).catch(e => { console.error(e); $("authErr").textContent = friendly(e.code); });

async function ensureUserDoc(user){
  try {
    const ref = doc(db, "users", user.uid);
    if (!(await getDoc(ref)).exists()) {
      await setDoc(ref, {
        uid: user.uid, name: user.displayName || "", email: user.email || "", country: "",
        provider: (user.providerData[0] && user.providerData[0].providerId) || "password",
        createdAt: serverTimestamp()
      }, { merge: true });
    }
  } catch (e) { console.error("User doc failed:", e); }
}
$("authBtn").onclick = submitAuth;
["email","password","name","country"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") submitAuth(); }));
$("logoutBtn").onclick = () => signOut(auth);

/* ---- Chat ---- */
const msgsEl = $("msgs");
const fmtTime = ts => ts ? ts.toDate().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "sending…";

function render(snap, uid){
  const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 120;
  msgsEl.innerHTML = "";
  if (snap.empty) {
    msgsEl.innerHTML = '<div class="empty">No messages yet. Say salam to fellow Bangladeshis abroad.</div>';
    return;
  }
  snap.forEach(d => {
    const m = d.data(), mine = m.uid === uid;
    const el = document.createElement("div");
    el.className = "msg " + (mine ? "mine" : "theirs");
    const n = document.createElement("div"); n.className = "n"; n.textContent = m.name || "Member";
    const b = document.createElement("div"); b.textContent = m.text;   // textContent prevents XSS
    const t = document.createElement("div"); t.className = "t"; t.textContent = fmtTime(m.createdAt);
    el.append(n, b, t); msgsEl.appendChild(el);
  });
  if (nearBottom || snap.size <= 1) msgsEl.scrollTop = msgsEl.scrollHeight;
}

function startChat(user){
  const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(200));
  unsub = onSnapshot(q, { includeMetadataChanges: false }, snap => render(snap, user.uid), err => {
    msgsEl.innerHTML = '<div class="empty">' + friendly(err.code) + '</div>';
  });
}

async function sendMessage(){
  const user = auth.currentUser, input = $("msgInput"), text = input.value.trim();
  if (!user || !text) return;
  input.value = ""; input.focus();
  try {
    await addDoc(collection(db, "messages"), {
      text, uid: user.uid, name: user.displayName || user.email.split("@")[0],
      createdAt: serverTimestamp()
    });
  } catch (e) { input.value = text; alert(friendly(e.code)); }
}
$("sendBtn").onclick = sendMessage;
$("msgInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

/* ---- Session state ---- */
if (configured) {
  onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    const loggedIn = !!user;
    $("authView").classList.toggle("hidden", loggedIn);
    $("chatView").classList.toggle("hidden", !loggedIn);
    if (loggedIn) {
      $("who").textContent = user.displayName || user.email;
      startChat(user);
      ensureUserDoc(user);
    } else { msgsEl.innerHTML = ""; $("password").value = ""; }
  });
}
</script>
</body>
</html>
